project_name: "single_agent_experiment"
sub_project_name: "training"
experiment_name: "fno_nll_loss"
seed: 42

data:
  data_path: "data/physics_single_agent_train"
  batch_size: 32

loss:
  name: "nll"

model:
  type: "fno"
  h_ctx: 5
  h_pred: 5
  modes_t: 4
  modes_h: 8
  modes_w: 8
  width: 32
  n_layers: 4
  use_grid: true
  use_time: true
  min_std: 0.001

optimizer:
  max_epochs: 500
