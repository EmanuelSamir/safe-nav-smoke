project_name: "single_agent_experiment"
sub_project_name: "training"
experiment_name: "fno_mse_det_loss"
seed: 42

data:
  data_path: "data/physics_single_agent_train"
  batch_size: 8

loss:
  name: "mse"

model:
  type: "fno"
  is_probabilistic: false
  h_ctx: 5
  h_pred: 5
  modes_t: 4
  modes_h: 8
  modes_w: 8
  width: 32
  n_layers: 4

checkpoint:
  monitor: "val_loss"

optimizer:
  max_epochs: 500
