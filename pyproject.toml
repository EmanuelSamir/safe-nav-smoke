[tool.ruff]
line-length = 100
target-version = "py310" # ajusta la versión según necesites

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "D",  # pydocstyle
]
ignore = ["D100", "D104", "D101", "D102"] # Opcional: ignorar "falta docstring" en public module/class/methods

[tool.ruff.lint.pydocstyle]
convention = "google"
