world_x_size: ${world_size.0}   # overridden by playback data if playback_path is set
world_y_size: ${world_size.1}

max_steps: 200        # overridden by playback data if playback_path is set
clock: 0.1
test: false
num_episodes: 200

# render: "human"     → live matplotlib window (use for debugging/demo)
# render: "rgb_array" → no live window, frames saved to gif
render: "human"
render_save_every: 2

# Set to true to save environment transitions as a Hugging Face dataset.
save_transitions: false

# Goal settings (used when playback_path is not set or as fallback)
goal_radius: 0.5
num_agents: 1
goal_locations: [[5.0, 5.0]]
initial_locations: null

# Collision settings
collision_radius: 0.8
terminate_on_collision: false
collision_penalty: -10.0
smoke_density_threshold: null
