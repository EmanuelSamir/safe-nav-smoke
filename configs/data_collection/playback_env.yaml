num_episodes: 100
episode_steps: 200
output_path: "data/planning_smoke_200_steps_100_episodes"

# Grid settings
x_size: 30.0
y_size: 20.0
resolution: 0.2
dt: 0.1

# Physical parameters (SmokeParams defaults)
wind_speed: 8.0
emission_rate: 2.0
diffusion_rate: 2.0
decay_rate: 1.5
buoyancy: 1.2

# Testing flag for visualization
test: false

# Hydra settings for output directory organization
hydra:
  run:
    dir: outputs/playback_generation/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/playback_generation/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
