num_episodes: 500
episode_steps: 100
output_path: "data/physics_smoke_slow"

# Grid settings (inherited from global: world_size = [35.0, 35.0])
x_size: 35.0
y_size: 35.0
resolution: 0.2
dt: 0.1

# Randomization parameters
num_blobs_range: [4, 8]
blob_min_dist: 5.0
blob_spread_range: [1.0, 3.0]
blob_intensity: 1.0

# Physical parameters (SmokeParams defaults)
wind_speed: 5.0
emission_rate: 1.8
diffusion_rate: 0.0
decay_rate: 1.5
buoyancy: 1.2

# Testing flag for visualization
test: false

# Hydra settings for output directory organization
hydra:
  run:
    dir: outputs/playback_generation/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/playback_generation/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
