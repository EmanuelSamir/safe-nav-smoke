experiment_name: "conv_lstm"
seed: 42

data:
  data_path: "data/physics_smoke"
  batch_size: 8
  train_split: 0.9
  max_samples: null
  sequence_length: 30
  num_workers: 0

model:
  h_ctx: 5
  h_pred: 5
  hidden_dim: 32
  n_layers: 3
  kernel_size: 3
  use_grid: true
  use_time: true
  min_std: 1.0e-4

loss:
  beta: null

optimizer:
  lr: 1.0e-3
  min_lr: 1.0e-4
  max_epochs: 250
  grad_clip: 1.0

checkpoint:
  save_top_k: 3
  monitor: "val_nll"
  mode: "min"

visualizer:
  visualize_every: 10

