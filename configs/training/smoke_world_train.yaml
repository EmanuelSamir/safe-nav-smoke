# Hydra config for Smoke World Model (Autoregressive Fluid)
name: "smoke_world_train"
seed: 42

training:
  batch_size: 32
  epochs: 100
  lr: 0.0001
  lambda_forecast: 1.0
  curriculum_epochs: 25

data:
  data_path: "data/sensor_dataset_hf"
  sample_ratio: 1.0
  seq_len: 20
  past_frames: 1
model:
  modes: 12
  latent_dim: 128

# Hydra settings for output directory organization
hydra:
  run:
    dir: outputs/training/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/training/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
